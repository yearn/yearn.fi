name: Publish vault widget

on:
  workflow_dispatch:
    inputs:
      yearn_bold_ref:
        description: yearn-bold ref to verify against the package artifact
        required: true
        default: main
  push:
    tags:
      - vault-widget-v*

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify package
        run: |
          bun run --cwd packages/vault-widget tslint
          bun run --cwd packages/vault-widget test
          bun run --cwd packages/vault-widget build
          bun run --cwd packages/vault-widget verify:artifact

      - name: Verify yearn.fi consumer
        env:
          NEXT_PUBLIC_VAULT_WIDGET_ENABLED: "true"
        run: |
          bun run lint
          bun run tslint
          bun run test
          bun run build

      - name: Pack exact consumer artifact
        run: |
          TARBALL_NAME="$(npm pack --workspace @yearn/vault-widget --pack-destination "$RUNNER_TEMP" | tail -n 1)"
          echo "WIDGET_TARBALL=$RUNNER_TEMP/$TARBALL_NAME" >> "$GITHUB_ENV"

      - name: Checkout yearn-bold consumer
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: yearn/yearn-bold
          ref: ${{ inputs.yearn_bold_ref || 'main' }}
          path: yearn-bold

      - name: Verify yearn-bold consumer
        working-directory: yearn-bold
        env:
          NEXT_PUBLIC_VAULT_WIDGET_ENABLED: "true"
        run: |
          npm install --save-exact "$WIDGET_TARBALL"
          npm run lint
          npm run build

      - name: Verify npm access
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm whoami
          npm access list packages @yearn

      - name: Publish restricted package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --workspace @yearn/vault-widget --access restricted --provenance
