name: Deploy to Vercel

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: vercel-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write
  id-token: write
  pull-requests: write

cache-mode: none

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      yearn: ${{ steps.filter.outputs.yearn }}
      ybold: ${{ steps.filter.outputs.ybold }}
      erc4626: ${{ steps.filter.outputs.erc4626 }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            shared: &shared
              - 'package.json'
              - 'bun.lock'
              - 'bunfig.toml'
              - '.bunfig.toml'
              - '.npmrc'
              - 'tsconfig.base.json'
              - 'vercel.json'
              - 'packages/vault-widget/**'
              - 'packages/wallet-ui/**'
            yearn:
              - *shared
              - 'packages/site-header/**'
              - 'apps/yearn/**'
            ybold:
              - *shared
              - 'apps/ybold/**'
            erc4626:
              - *shared
              - 'packages/site-header/**'
              - 'apps/4626/**'

  yearn:
    uses: yearn/yearn-gha/.github/workflows/vercel-deploy.yml@d7047bb766f85ae4dfe0c4ab080bee3ebb1a7d31
    with:
      project: yearn-fi
      identity-id: ${{ github.event_name == 'pull_request' && vars.DOPPLER_PREVIEW_IDENTITY_ID || vars.DOPPLER_PRODUCTION_IDENTITY_ID }}

  ybold:
    uses: yearn/yearn-gha/.github/workflows/vercel-deploy.yml@d7047bb766f85ae4dfe0c4ab080bee3ebb1a7d31
    with:
      project: yearn-bold
      identity-id: ${{ github.event_name == 'pull_request' && vars.DOPPLER_PREVIEW_IDENTITY_ID || vars.DOPPLER_PRODUCTION_IDENTITY_ID }}

  erc4626:
    needs: changes
    if: needs.changes.outputs.erc4626 == 'true'
    uses: yearn/yearn-gha/.github/workflows/vercel-deploy.yml@d7047bb766f85ae4dfe0c4ab080bee3ebb1a7d31
    with:
      project: yearn-4626
      identity-id: ${{ github.event_name == 'pull_request' && vars.DOPPLER_PREVIEW_IDENTITY_ID || vars.DOPPLER_PRODUCTION_IDENTITY_ID }}
