name: Deploy to Vercel

on:
  push:
    branches: [main]

concurrency:
  group: vercel-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write
  id-token: write
  pull-requests: write

jobs:
  deploy:
    uses: yearn/yearn-gha/.github/workflows/vercel-deploy.yml@9701cd661a98fda358bb7b273b2baab97f12dea2
    with:
      project: yearn-fi
      identity-id: ${{ vars.DOPPLER_PRODUCTION_IDENTITY_ID }}
